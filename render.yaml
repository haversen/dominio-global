# Despliegue en Render (https://render.com): New → Blueprint → elige este repositorio.
services:
  - type: web
    name: dominio-global
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Base de datos gratuita para que las partidas sobrevivan a reinicios (ver README).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
